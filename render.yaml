# Render.com Blueprint - Deploy all services at once
# Upload this file to your GitHub repo root
# Then on Render: New -> Blueprint -> Connect your repo

services:
  # Auth Service
  - type: web
    name: wishera-auth-service
    env: docker
    dockerfilePath: ./auth-service/Dockerfile
    dockerContext: ./
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_URLS
        value: http://+:5219
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Authentication__Google__RedirectUri
        value: https://wishera-auth-service.onrender.com/signin-google
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: WisheraAuthService
      - key: ConnectionStrings__MongoDB
        sync: false  # You'll add this manually
      - key: MongoDB__Database
        value: WishlistApp
      # RabbitMQ Configuration (optional - service will work without it)
      # Option 1: Use CloudAMQP connection string (recommended)
      - key: CLOUDAMQP_URL
        sync: false  # Set this manually: e.g., "amqps://user:pass@host:port/vhost"
      - key: RABBITMQ_URL
        sync: false  # Alternative: RABBITMQ_URL (same format as CLOUDAMQP_URL)
      # Option 2: Use individual environment variables
      - key: RABBITMQ_HOSTNAME
        sync: false  # Set this manually: e.g., "coyote.rmq.cloudamqp.com"
      - key: RABBITMQ_USERNAME
        sync: false  # Set this manually: your CloudAMQP username
      - key: RABBITMQ_PASSWORD
        sync: false  # Set this manually: your CloudAMQP password
      - key: RABBITMQ_VIRTUALHOST
        sync: false  # Optional: usually same as username for CloudAMQP
      - key: RABBITMQ_PORT
        value: 5672
      # Option 3: Use configuration format (alternative)
      - key: RabbitMq__HostName
        sync: false
      - key: RabbitMq__UserName
        sync: false
      - key: RabbitMq__Password
        sync: false
      - key: RabbitMq__VirtualHost
        sync: false
      - key: RabbitMq__Port
        value: 5672
      - key: RabbitMq__Exchange
        value: auth.exchange
      - key: RabbitMq__Queue
        value: auth.requests
      - key: Cloudinary__CloudName
        sync: false
      - key: Cloudinary__ApiKey
        sync: false
      - key: Cloudinary__ApiSecret
        sync: false

  # Gift-Wishlist Service
  - type: web
    name: wishera-gift-service
    env: docker
    dockerfilePath: ./gift-wishlist-service/Dockerfile
    dockerContext: ./
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_URLS
        value: http://+:5300
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Jwt__Key
        fromService:
          type: web
          name: wishera-auth-service
          envVarKey: Jwt__Key
      - key: Jwt__Issuer
        value: WisheraAuthService
      - key: ConnectionStrings__MongoDB
        sync: false
      - key: MongoDB__Database
        value: WishlistApp
      - key: ConnectionStrings__Redis
        sync: false
      - key: RabbitMq__HostName
        sync: false
      - key: RabbitMq__UserName
        sync: false
      - key: RabbitMq__Password
        sync: false
      - key: RabbitMq__Port
        value: 5672
      - key: Cloudinary__CloudName
        sync: false
      - key: Cloudinary__ApiKey
        sync: false
      - key: Cloudinary__ApiSecret
        sync: false

  # User Service
  - type: web
    name: wishera-user-service
    env: docker
    dockerfilePath: ./user-service/Dockerfile
    dockerContext: ./
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_URLS
        value: http://+:5400
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Jwt__Key
        fromService:
          type: web
          name: wishera-auth-service
          envVarKey: Jwt__Key
      - key: Jwt__Issuer
        value: WisheraAuthService
      - key: ConnectionStrings__MongoDB
        sync: false
      - key: MongoDB__Database
        value: WishlistApp
      - key: ConnectionStrings__Redis
        sync: false
      - key: RabbitMq__HostName
        sync: false
      - key: RabbitMq__UserName
        sync: false
      - key: RabbitMq__Password
        sync: false
      - key: RabbitMq__Port
        value: 5672
      - key: Cloudinary__CloudName
        sync: false
      - key: Cloudinary__ApiKey
        sync: false
      - key: Cloudinary__ApiSecret
        sync: false

  # Main API Gateway
  - type: web
    name: wishera-app
    env: docker
    dockerfilePath: ./WishlistApp/Dockerfile
    dockerContext: ./
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_URLS
        value: http://+:5155
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Jwt__Key
        fromService:
          type: web
          name: wishera-auth-service
          envVarKey: Jwt__Key
      - key: Jwt__Issuer
        value: WisheraAuthService
      - key: RabbitMq__HostName
        sync: false
      - key: RabbitMq__UserName
        sync: false
      - key: RabbitMq__Password
        sync: false
      - key: RabbitMq__Port
        value: 5672

  # Chat Service
  - type: web
    name: wishera-chat-service
    env: docker
    dockerfilePath: ./chat-server-side/Dockerfile
    dockerContext: ./chat-server-side
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_URLS
        value: http://+:5002
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ChatMongo__ConnectionString
        sync: false
      - key: ChatMongo__Database
        value: wishlist_chat
      - key: ChatMongo__Collection
        value: messages
      - key: Cloudinary__CloudName
        sync: false
      - key: Cloudinary__ApiKey
        sync: false
      - key: Cloudinary__ApiSecret
        sync: false

